name: Alpaca ICC Trading Bot

on:
  schedule:
    # Runs every 15 minutes during US market hours (Mon-Fri)
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch: # Enables the manual "Run workflow" test button

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install google-genai openai alpaca-py pydantic pandas requests

      - name: Run Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python bot.py
